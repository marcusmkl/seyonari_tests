    Image Types
        - PNG and JPG are in raster formats. 
            - pixel-based with the data tracking the color value in each pixel.
            - becomes blurry if enlarged or scaled
        - SVG's or scalar vector graphic
            - tracks data based on paths and equations to plot points, lines, and curves
            - can scale to any size without impacting the quality
            - stores data in XML where you can directly use it as raw HTML in your code with the <svg> element
            - can change the color of the image through programming
            - great to use for icons or custom bullet points, logos

    Replaced Elements
        - an element whose content is determined by an external resource rather than by CSS itself
        - can control the layout or position of the element but not the actual content of the image
            - likewise on iframe. it can change the positioning of the embedded site but not the content itself

    Different Target Attribute Types
        <a href="(insert source)" target="_blank">
            _blank = open in new window/tab
            _self = open in the same window/tab
            _parent = opens the link in the parent of the current context
                if you have an iframe with _parent, it would open in the window/tab not the embed
            _top = opens the link in the top-most browsing context
                always open in the full browser tab/window,

    Absolute and Relative Paths
        - A path is a string that specifies the location of a file or directory in a file system
        - Absolute paths include all the directories, domains, filename, etc
        - Relative paths specifies the location of a file relative to the directory of the current file.
        - Use absolute paths when linking to a resource hosted on an external website.
        - Use absolute paths when you need the link to a page or resource to work consistently regardless of the document location within the site.
        - Use relative paths when linking to resources within the same website.
        - Use relative paths if you want to keep your code cleaner and easier to maintain during development.
        - Use relative paths during local testing to ensure links work without an internet connection.

    Difference Between Slashes, a Single Dot, and Double Dot in Path Syntax
        - The slash is known as the "path separator". It is used to indicate a break in the text between folder or file names. (Absolute)
        - A single dot points to the current directory, and two dots point to the parent directory. 
        - You will typically see a single dot used to ensure that the path is recognized as a relative path.

    Different Link States
        :link - state represents a link which the user has not visited, clicked, or interacted with yet.
        :visited - applies when a user has already visited the page being linked to. By default, this turns the link purple
        :hover - applies when a user is hovering their cursor over a link. helpful for providing extra attention to a link, to ensure a user actually intends to click it.
        :focus - applies when we focus on a link.
        :active - links are being activated by the user.
        link visited hover focus active -> order by which you should style your links
